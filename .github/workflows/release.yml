name: Release App Bundle

on:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar canvi de versió
        id: detect
        run: |
          NEW_VERSION=$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
          OLD_VERSION=$(git show "${{ github.event.before }}:pubspec.yaml" 2>/dev/null | grep '^version:' | head -n1 | cut -d' ' -f2 | cut -d'+' -f1 || true)

          if [ -n "$NEW_VERSION" ] && [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-version
    if: needs.detect-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instal·lar dependències
        run: flutter pub get

      - name: Passar els tests
        run: flutter test

      - name: Descodificar el KeyStore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Crear key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=keystore.jks
          EOF

      - name: Generar App Bundle
        run: flutter build appbundle --release

      - name: Pujar l'App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: Nova Versió v${{ needs.detect-version.outputs.version }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
