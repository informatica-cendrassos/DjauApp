name: Release App Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compare.outputs.should_release }}
      version: ${{ steps.compare.outputs.version }}

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Extreure versió de pubspec.yaml
        id: app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Obtenir darrera release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              const tag = data.tag_name || "";
              const version = tag.replace(/^v/, "");
              core.setOutput("tag", tag);
              core.setOutput("version", version);
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("tag", "");
                core.setOutput("version", "");
              } else {
                throw error;
              }
            }

      - name: Comparar versions
        id: compare
        run: |
          APP_VERSION="${{ steps.app.outputs.version }}"
          LAST_RELEASE_VERSION="${{ steps.latest.outputs.version }}"

          if [ -n "$APP_VERSION" ] && [ "$APP_VERSION" != "$LAST_RELEASE_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instal·lar dependències
        run: flutter pub get

      - name: Passar els tests
        run: flutter test

      - name: Descodificar el KeyStore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Crear key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=keystore.jks
          EOF

      - name: Generar App Bundle
        run: flutter build appbundle --release

      - name: Pujar l'App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: Nova Versió v${{ needs.detect-version.outputs.version }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
